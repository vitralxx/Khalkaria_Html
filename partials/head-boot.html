<script data-nav-boot>(function(){try{var s=JSON.parse(localStorage.getItem('khalkaria_nav')||'{}'),h=document.documentElement;if(s.trilho)h.setAttribute('data-nav','trilho');if(s.fechados&&s.fechados.length)h.setAttribute('data-nav-fechados',s.fechados.join(' '))}catch(e){}var m='',r=false;try{m=localStorage.getItem('khalkaria_movimento')}catch(e){}r=m==='reduzido';if(!r&&m!=='normal')try{r=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}document.documentElement.setAttribute('data-movimento',r?'reduzido':'normal');var p=false;try{p=localStorage.getItem('khalkaria_ficha_previa')==='1'}catch(e){}if(!p)try{var q=/[?&]ficha=([^&#]*)/.exec(location.search);p=!!q&&decodeURIComponent(q[1])==='v3'}catch(e){}if(p){var d='trilho';document.documentElement.setAttribute('data-ficha-previa','');try{if(localStorage.getItem('khalkaria_ficha3_dock')==='aberto')d='aberto'}catch(e){}document.documentElement.setAttribute('data-ficha3',d)}})()</script>
