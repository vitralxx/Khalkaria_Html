<script data-nav-boot>(function(){try{var s=JSON.parse(localStorage.getItem('khalkaria_nav')||'{}'),h=document.documentElement;if(s.trilho)h.setAttribute('data-nav','trilho');if(s.fechados&&s.fechados.length)h.setAttribute('data-nav-fechados',s.fechados.join(' '))}catch(e){}var m='',r=false;try{m=localStorage.getItem('khalkaria_movimento')}catch(e){}r=m==='reduzido';if(!r&&m!=='normal')try{r=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}document.documentElement.setAttribute('data-movimento',r?'reduzido':'normal')})()</script>
